name: Build Native Images

on:
  push:
    branches:
      - main
      - master
    paths:
      - 'java-harness-cli/src/**'
      - 'pom.xml'
      - '.github/workflows/build-native.yml'
  workflow_dispatch:
    inputs:
      create_release:
        description: '创建 GitHub Release'
        required: false
        default: false
        type: boolean

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
            arch: amd64
          - os: ubuntu-latest
            platform: linux
            arch: arm64
          # macOS Intel - 使用原生 Intel 运行器
          - os: macos-15-intel
            platform: darwin
            arch: amd64
          # macOS ARM - 使用原生 Apple Silicon 运行器
          - os: macos-latest
            platform: darwin
            arch: arm64
          - os: windows-latest
            platform: windows
            arch: amd64
      fail-fast: false

    runs-on: ${{ matrix.os }}

    steps:
      - name: 📥 Checkout 代码
        uses: actions/checkout@v4

      - name: 🔧 设置 GraalVM
        uses: graalvm/setup-graalvm@v1
        with:
          java-version: '17.0.9'
          distribution: 'graalvm-community'
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: ✅ 验证环境
        shell: bash
        run: |
          echo "JAVA_HOME: $JAVA_HOME"
          echo "GRAALVM_HOME: $GRAALVM_HOME"
          java -version
          native-image --version || echo "native-image not found, will be installed"

      - name: 🔨 安装 native-image
        shell: bash
        run: |
          gu install native-image || echo "native-image already installed"

      - name: 📦 构建所有模块
        shell: bash
        run: |
          mvn clean install -DskipTests -Dmaven.test.skip=true -B

      - name: 🔨 构建 Native Image
        shell: bash
        run: |
          cd java-harness-cli
          # 每个运行器原生构建自身架构，无需任何 target 参数
          mvn -Pnative package -DskipTests -Dmaven.test.skip=true -B

      - name: 📋 复制构建产物（扁平化结构）
        shell: bash
        run: |
          mkdir -p bin
          if [ "${{ matrix.platform }}" = "windows" ]; then
            TARGET_FILE="bin/harness-windows-amd64.exe"
            SOURCE_FILE="java-harness-cli/target/harness.exe"
          else
            TARGET_FILE="bin/harness-${{ matrix.platform }}-${{ matrix.arch }}"
            SOURCE_FILE="java-harness-cli/target/harness"
          fi
          cp "$SOURCE_FILE" "$TARGET_FILE"
          if [ "${{ matrix.platform }}" != "windows" ]; then
            chmod +x "$TARGET_FILE"
          fi
          echo "✅ 产物已复制到 $TARGET_FILE"

      - name: 🧪 测试可执行文件
        shell: bash
        run: |
          if [ "${{ matrix.platform }}" = "windows" ]; then
            BIN="bin/harness-windows-amd64.exe"
          else
            BIN="bin/harness-${{ matrix.platform }}-${{ matrix.arch }}"
          fi
          if [ ! -f "$BIN" ]; then
            echo "❌ 二进制文件不存在: $BIN"
            exit 1
          fi
          echo "✅ 测试运行 $BIN --version"
          $BIN --version

      - name: 📤 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: harness-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            ${{ matrix.platform == 'windows' && 'bin/harness-windows-amd64.exe' || format('bin/harness-{0}-{1}', matrix.platform, matrix.arch) }}
          retention-days: 7
          if-no-files-found: error

  release:
    needs: build
    if: inputs.create_release == true
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 📥 下载所有构建产物
        uses: actions/download-artifact@v4
        with:
          path: binaries

      - name: 📦 打包所有平台二进制
        shell: bash
        run: |
          mkdir -p release_bin
          find binaries -type f -name "harness*" -exec cp {} release_bin/ \;
          cd release_bin
          for f in harness*; do
            dir=$(dirname $(find ../binaries -name "$f" -type f | head -1))
            platform_arch=$(basename "$dir" | sed 's/harness-//')
            mv "$f" "harness-${platform_arch}${f##harness}"
          done
          ls -la
          zip -r harness-all.zip .
          echo "✅ 打包完成，生成 harness-all.zip"

      - name: 📦 创建 Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ github.run_number }}
          name: Native Images - ${{ github.run_number }}
          draft: false
          prerelease: true
          files: release_bin/harness-all.zip
          body: |
            ## Java Harness Native Image 多平台构建

            ### 压缩包内容：
            - `harness-linux-amd64` - Linux AMD64 (x86_64)
            - `harness-linux-arm64` - Linux ARM64 (arch64)
            - `harness-darwin-amd64` - macOS Intel (x86_64) **（原生构建）**
            - `harness-darwin-arm64` - macOS Apple Silicon (arm64)
            - `harness-windows-amd64.exe` - Windows (x86_64)

            ### 使用方法：
            ```bash
            # 解压
            unzip harness-all.zip

            # 添加执行权限（Linux/macOS）
            chmod +x harness-*

            # 运行
            ./harness-linux-amd64 --version
            # Windows 直接运行 .exe