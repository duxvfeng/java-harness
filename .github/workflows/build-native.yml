name: Build Native Images

on:
  push:
    branches:
      - main
      - master
      - feature/**
    paths:
      - 'java-harness-cli/src/**'
      - 'pom.xml'
      - '.github/workflows/build-native.yml'
  workflow_dispatch:
    inputs:
      create_release:
        description: '创建 GitHub Release'
        required: false
        default: false
        type: boolean

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
            arch: amd64
          - os: ubuntu-latest
            platform: linux
            arch: arm64
          # ✅ 长期方案：在 Apple Silicon 运行器上交叉编译 Intel 二进制
          - os: macos-latest
            platform: darwin
            arch: amd64
            native_target: 'x86_64'   # 关键：指定 Intel 目标
          # Apple Silicon 原生构建
          - os: macos-latest
            platform: darwin
            arch: arm64
            native_target: 'arch64'  # 关键：指定 ARM 目标
          - os: windows-latest
            platform: windows
            arch: amd64
      fail-fast: false

    runs-on: ${{ matrix.os }}

    steps:
      - name: 📥 Checkout 代码
        uses: actions/checkout@v4

      - name: 🔧 设置 GraalVM
        uses: graalvm/setup-graalvm@v1
        with:
          java-version: '17.0.9'
          distribution: 'graalvm-community'
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: ✅ 验证环境
        shell: bash
        run: |
          echo "JAVA_HOME: $JAVA_HOME"
          echo "GRAALVM_HOME: $GRAALVM_HOME"
          java -version
          native-image --version || echo "native-image not found, will be installed"

      - name: 🔨 安装 native-image
        shell: bash
        run: |
          gu install native-image || echo "native-image already installed"

      - name: 📦 构建所有模块
        shell: bash
        run: |
          mvn clean install -DskipTests -Dmaven.test.skip=true -B

      - name: 🔨 构建 Native Image
        shell: bash
        run: |
          cd java-harness-cli
          # 关键：通过 -Dnative-image.target 指定目标架构
          # 对于 darwin-amd64 (Intel)，target 为 x86_64
          # 对于 darwin-arm64 (Apple Silicon)，target 为 arch64
          if [ -n "${{ matrix.native_target }}" ]; then
            mvn -Pnative package -DskipTests -Dmaven.test.skip=true -B \
              -Dnative-image.target=${{ matrix.native_target }}
          else
            # Linux 和 Windows 保持原有方式
            mvn -Pnative package -DskipTests -Dmaven.test.skip=true -B
          fi

      - name: 📋 复制构建产物（扁平化结构）
        shell: bash
        run: |
          mkdir -p bin
          if [ "${{ matrix.platform }}" = "windows" ]; then
            # Windows: harness-windows-amd64.exe
            TARGET_FILE="bin/harness-windows-amd64.exe"
            SOURCE_FILE="java-harness-cli/target/harness.exe"
          else
            # Unix: harness-{platform}-{arch}
            TARGET_FILE="bin/harness-${{ matrix.platform }}-${{ matrix.arch }}"
            SOURCE_FILE="java-harness-cli/target/harness"
          fi
          cp "$SOURCE_FILE" "$TARGET_FILE"
          if [ "${{ matrix.platform }}" != "windows" ]; then
            chmod +x "$TARGET_FILE"
          fi
          echo "✅ 产物已复制到 $TARGET_FILE"

      - name: 🧪 测试可执行文件
        shell: bash
        run: |
          if [ "${{ matrix.platform }}" = "windows" ]; then
            BIN="bin/harness-windows-amd64.exe"
          else
            BIN="bin/harness-${{ matrix.platform }}-${{ matrix.arch }}"
          fi
          if [ ! -f "$BIN" ]; then
            echo "❌ 二进制文件不存在: $BIN"
            exit 1
          fi
          echo "✅ 测试运行 $BIN --version"
          $BIN --version

      - name: 📤 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: harness-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            ${{ matrix.platform == 'windows' && 'bin/harness-windows-amd64.exe' || format('bin/harness-{0}-{1}', matrix.platform, matrix.arch) }}
          retention-days: 7
          if-no-files-found: error

  # 自动将构建产物提交回 bin/ 目录
  update-bin:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 📥 Checkout 代码
        uses: actions/checkout@v4

      - name: 📦 下载所有构建产物
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: 📋 复制到 bin/ 目录
        run: |
          # 确保 bin 目录存在
          mkdir -p bin

          # 复制所有平台的二进制文件到 bin/
          find artifacts -type f \( -name "harness*" -o -name "*.exe" \) -exec cp {} bin/ \;

          # 设置执行权限（Unix 系统）
          chmod +x bin/harness-* 2>/dev/null || true

          # 显示结果
          ls -lh bin/

      - name: 📤 提交到仓库
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'

          # 显示当前分支信息
          echo "📍 当前分支: ${GITHUB_REF_NAME}"
          echo "📍 完整引用: ${GITHUB_REF}"
          git branch -a

          # 添加 bin/ 目录（强制添加被 .gitignore 忽略的文件）
          git add -f bin/

          # 检查是否有变更
          if git diff --staged --quiet; then
            echo "⚠️ 警告：没有检测到新的变更"
            echo "📋 Git 状态："
            git status
            echo "📋 暂存区内容："
            git diff --staged --name-only
          else
            echo "📝 检测到变更，准备提交..."
            git status

            # 提交变更
            git commit -m "chore: update native binaries from CI build #${{ github.run_number }}

            🤖 Auto-generated by GitHub Actions
            📦 Build: ${{ github.run_number }}
            🔗 Commit: ${{ github.sha }}"

            echo "📤 推送到 ${{ github.ref_name }} 分支..."
            # 推送到当前分支
            git push origin HEAD:${{ github.ref_name }}
            echo "✅ 已将二进制文件提交到 bin/ 目录"
          fi

  release:
    needs: build
    if: inputs.create_release == true
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 📥 下载所有构建产物
        uses: actions/download-artifact@v4
        with:
          path: binaries

      - name: 📦 打包所有平台二进制
        shell: bash
        run: |
          mkdir -p release_bin
          find binaries -type f -name "harness*" -exec cp {} release_bin/ \;
          cd release_bin
          for f in harness*; do
            dir=$(dirname $(find ../binaries -name "$f" -type f | head -1))
            platform_arch=$(basename "$dir" | sed 's/harness-//')
            mv "$f" "harness-${platform_arch}${f##harness}"
          done
          ls -la
          zip -r harness-all.zip .
          echo "✅ 打包完成，生成 harness-all.zip"

      - name: 📦 创建 Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ github.run_number }}
          name: Native Images - ${{ github.run_number }}
          draft: false
          prerelease: true
          files: release_bin/harness-all.zip
          body: |
            ## Java Harness Native Image 多平台构建

            ### 压缩包内容：
            - `harness-linux-amd64` - Linux AMD64 (x86_64)
            - `harness-linux-arm64` - Linux ARM64 (arch64)
            - `harness-darwin-amd64` - macOS Intel (x86_64) **（通过交叉编译构建）**
            - `harness-darwin-arm64` - macOS Apple Silicon (arm64)
            - `harness-windows-amd64.exe` - Windows (x86_64)

            ### 使用方法：
            ```bash
            # 解压
            unzip harness-all.zip

            # 添加执行权限（Linux/macOS）
            chmod +x harness-*

            # 运行
            ./harness-linux-amd64 --version
            # Windows 直接运行 .exe# Updated at Mon Aug 10 16:23:18     2026
