name: Build Native Images

on:
  push:
    branches:
      - main
      - master
    paths:
      - 'java-harness-cli/src/**'
      - 'pom.xml'
      - '.github/workflows/build-native.yml'
  workflow_dispatch:
    inputs:
      create_release:
        description: '创建 GitHub Release'
        required: false
        default: false
        type: boolean

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
            arch: amd64
            ext: ''
          - os: ubuntu-latest
            platform: linux
            arch: arm64
            ext: ''
          - os: macos-latest
            platform: darwin
            arch: amd64
            ext: ''
          - os: macos-14
            platform: darwin
            arch: arm64
            ext: ''
          - os: windows-latest
            platform: windows
            arch: amd64
            ext: '.exe'
      fail-fast: false

    runs-on: ${{ matrix.os }}

    steps:
      - name: 📥 Checkout 代码
        uses: actions/checkout@v4

      - name: 🔧 设置 GraalVM
        uses: graalvm/setup-graalvm@v1
        with:
          java-version: '17.0.9'
          distribution: 'graalvm-community'
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: ✅ 验证环境
        shell: bash
        run: |
          echo "JAVA_HOME: $JAVA_HOME"
          echo "GRAALVM_HOME: $GRAALVM_HOME"
          java -version
          native-image --version || echo "native-image not found, will be installed"

      - name: 🔨 安装 native-image
        shell: bash
        run: |
          gu install native-image || echo "native-image already installed"

      - name: 📦 构建所有模块
        shell: bash
        run: |
          mvn clean install -DskipTests -B

      - name: 🔨 构建 Native Image
        shell: bash
        run: |
          cd java-harness-cli
          mvn -Pnative package -DskipTests -B

      - name: 📁 创建输出目录
        shell: bash
        run: |
          mkdir -p bin/${{ matrix.platform }}-${{ matrix.arch }}

      - name: 📋 复制构建产物
        shell: bash
        run: |
          if [ "${{ matrix.platform }}" = "windows" ]; then
            cp java-harness-cli/target/harness.exe bin/${{ matrix.platform }}-${{ matrix.arch }}/harness.exe
          else
            cp java-harness-cli/target/harness bin/${{ matrix.platform }}-${{ matrix.arch }}/harness
            chmod +x bin/${{ matrix.platform }}-${{ matrix.arch }}/harness
          fi

      - name: 🧪 测试可执行文件
        shell: bash
        run: |
          cd bin/${{ matrix.platform }}-${{ matrix.arch }}
          if [ "${{ matrix.platform }}" = "windows" ]; then
            ./harness.exe --version || echo "Version check failed"
          else
            ./harness --version || echo "Version check failed"
          fi

      - name: 📤 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: harness-${{ matrix.platform }}-${{ matrix.arch }}
          path: bin/${{ matrix.platform }}-${{ matrix.arch }}/*
          retention-days: 7
          if-no-files-found: error

  release:
    needs: build
    if: inputs.create_release == true
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 📥 下载所有构建产物
        uses: actions/download-artifact@v4
        with:
          path: binaries

      - name: 📦 创建 Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ github.run_number }}
          name: Native Images - ${{ github.run_number }}
          draft: false
          prerelease: true
          files: |
            binaries/harness-linux-amd64/harness
            binaries/harness-linux-arm64/harness
            binaries/harness-darwin-amd64/harness
            binaries/harness-darwin-arm64/harness
            binaries/harness-windows-amd64/harness.exe
          body: |
            ## Java Harness Native Image 多平台构建

            ### 可用版本：
            - `harness` - Linux AMD64 (x86_64)
            - `harness` - Linux ARM64 (aarch64)
            - `harness` - macOS Intel (x86_64)
            - `harness` - macOS Apple Silicon (arm64)
            - `harness.exe` - Windows (x86_64)

            ### 使用方法：
            ```bash
            # Linux/macOS
            chmod +x harness
            ./harness --version

            # Windows
            harness.exe --version
            ```
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
