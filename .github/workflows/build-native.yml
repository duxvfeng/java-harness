name: Build Native Images

on:
  push:
    branches:
      - main
      - master
    paths:
      - 'java-harness-cli/src/**'
      - 'pom.xml'
      - '.github/workflows/build-native.yml'
  workflow_dispatch:
    inputs:
      create_release:
        description: '创建 GitHub Release'
        required: false
        default: false
        type: boolean

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
            arch: amd64
            ext: ''
          - os: ubuntu-latest
            platform: linux
            arch: arm64
            ext: ''
          - os: macos-13
            platform: darwin
            arch: amd64
            ext: ''
          - os: macos-latest
            platform: darwin
            arch: arm64
            ext: ''
          - os: windows-latest
            platform: windows
            arch: amd64
            ext: '.exe'
      fail-fast: false

    runs-on: ${{ matrix.os }}

    steps:
      - name: 📥 Checkout 代码
        uses: actions/checkout@v4

      - name: 🔧 设置 GraalVM
        uses: graalvm/setup-graalvm@v1
        with:
          java-version: '17.0.9'
          distribution: 'graalvm-community'
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: ✅ 验证环境
        shell: bash
        run: |
          echo "JAVA_HOME: $JAVA_HOME"
          echo "GRAALVM_HOME: $GRAALVM_HOME"
          java -version
          native-image --version || echo "native-image not found, will be installed"

      - name: 🔨 安装 native-image
        shell: bash
        run: |
          gu install native-image || echo "native-image already installed"

      - name: 📦 构建所有模块
        shell: bash
        run: |
          mvn clean install -DskipTests -Dmaven.test.skip=true -B

      - name: 🔨 构建 Native Image
        shell: bash
        run: |
          cd java-harness-cli
          mvn -Pnative package -DskipTests -Dmaven.test.skip=true -B

      - name: 📁 创建输出目录
        shell: bash
        run: |
          # 根据平台和架构创建目录
          if [ "${{ matrix.platform }}" = "windows" ]; then
            mkdir -p bin/windows
          elif [ "${{ matrix.platform }}" = "linux" ]; then
            mkdir -p bin/linux-${{ matrix.arch }}
          elif [ "${{ matrix.platform }}" = "darwin" ]; then
            mkdir -p bin/macos-${{ matrix.arch }}
          fi

      - name: 📋 复制构建产物
        shell: bash
        run: |
          if [ "${{ matrix.platform }}" = "windows" ]; then
            cp java-harness-cli/target/harness.exe bin/windows/harness.exe
          elif [ "${{ matrix.platform }}" = "linux" ]; then
            cp java-harness-cli/target/harness bin/linux-${{ matrix.arch }}/harness
            chmod +x bin/linux-${{ matrix.arch }}/harness
          elif [ "${{ matrix.platform }}" = "darwin" ]; then
            cp java-harness-cli/target/harness bin/macos-${{ matrix.arch }}/harness
            chmod +x bin/macos-${{ matrix.arch }}/harness
          fi

      - name: 📝 调整 marketplace.json
        shell: bash
        run: |
          # 根据当前平台设置可执行文件路径
          if [ "${{ matrix.platform }}" = "windows" ]; then
            EXECUTABLE="bin/windows/harness.exe"
          elif [ "${{ matrix.platform }}" = "linux" ]; then
            EXECUTABLE="bin/linux-${{ matrix.arch }}/harness"
          elif [ "${{ matrix.platform }}" = "darwin" ]; then
            EXECUTABLE="bin/macos-${{ matrix.arch }}/harness"
          fi

          # 修改 marketplace.json
          if command -v jq &> /dev/null; then
            jq ".plugins[0].executable = \"$EXECUTABLE\"" .claude-plugin/marketplace.json > .claude-plugin/marketplace.json.tmp
            mv .claude-plugin/marketplace.json.tmp .claude-plugin/marketplace.json
          else
            sed -i "s|\"executable\":.*|\"executable\": \"$EXECUTABLE\",|g" .claude-plugin/marketplace.json
          fi

          echo " marketplace.json 已设置为: $EXECUTABLE"

      - name: 🧪 测试可执行文件
        shell: bash
        run: |
          if [ "${{ matrix.platform }}" = "windows" ]; then
            cd bin/windows
            ./harness.exe --version || echo "Version check failed"
          elif [ "${{ matrix.platform }}" = "linux" ]; then
            cd bin/linux-${{ matrix.arch }}
            ./harness --version || echo "Version check failed"
          elif [ "${{ matrix.platform }}" = "darwin" ]; then
            cd bin/macos-${{ matrix.arch }}
            ./harness --version || echo "Version check failed"
          fi

      - name: 📤 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: harness-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            bin/windows/*
            bin/linux-*/
            bin/macos-*/
            .claude-plugin/marketplace.json
          retention-days: 7
          if-no-files-found: warn

  release:
    needs: build
    if: inputs.create_release == true
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 📥 下载所有构建产物
        uses: actions/download-artifact@v4
        with:
          path: binaries

      - name: 📦 创建 Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ github.run_number }}
          name: Native Images - ${{ github.run_number }}
          draft: false
          prerelease: true
          files: |
            binaries/harness-linux-amd64/harness
            binaries/harness-linux-arm64/harness
            binaries/harness-darwin-amd64/harness
            binaries/harness-darwin-arm64/harness
            binaries/harness-windows-amd64/harness.exe
          body: |
            ## Java Harness Native Image 多平台构建

            ### 可用版本：
            - `bin/linux-amd64/harness` - Linux AMD64 (x86_64)
            - `bin/linux-arm64/harness` - Linux ARM64 (aarch64)
            - `bin/macos-amd64/harness` - macOS Intel (x86_64)
            - `bin/macos-arm64/harness` - macOS Apple Silicon (arm64)
            - `bin/windows/harness.exe` - Windows (x86_64)

            ### 目录结构：
            ```
            bin/
            ├── windows/
            │   └── harness.exe
            ├── linux-amd64/
            │   └── harness
            ├── linux-arm64/
            │   └── harness
            ├── macos-amd64/
            │   └── harness
            └── macos-arm64/
                └── harness
            ```

            ### 使用方法：
            ```bash
            # Linux AMD64
            chmod +x bin/linux-amd64/harness
            ./bin/linux-amd64/harness --version

            # Linux ARM64
            chmod +x bin/linux-arm64/harness
            ./bin/linux-arm64/harness --version

            # macOS Intel
            chmod +x bin/macos-amd64/harness
            ./bin/macos-amd64/harness --version

            # macOS Apple Silicon
            chmod +x bin/macos-arm64/harness
            ./bin/macos-arm64/harness --version

            # Windows
            bin\windows\harness.exe --version
            ```
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
