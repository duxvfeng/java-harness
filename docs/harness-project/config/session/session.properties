# ============================================================================
# 会话管理配置案例（权威 .properties 格式）
# ============================================================================
# 说明：会话配置由 SessionConfigLoader 通过 java.util.Properties 加载，
#       因此是扁平的"点分键"，而不是 TOML 的 [session.*] 段。
#       键名、默认值严格对应 SessionConfigLoader.java。
#
# 部署：将本文件放到 SessionConfigLoader 构造时传入的路径（通常为
#       .claude/config/session.properties）。仅需写入你想覆盖默认值的键。
#
# 加载顺序（后者覆盖前者）：
#   1) 代码内置默认值（即下方注释中的"默认"）
#   2) 本配置文件
#   3) 环境变量（见下方"HARNESS_SESSION_*"）
# ============================================================================

# ---- 自动保存 ----
# 是否启用自动保存（默认 true）
session.auto_save.enable = true
# 触发保存的 Token 百分比阈值，逗号分隔（默认 80,90）
session.auto_save.thresholds = 80,90
# 保留的最近会话保存数量（默认 10）
session.auto_save.max_saves = 10
# 是否压缩保存数据（默认 true）
session.auto_save.compression = true
# 最小保存间隔分钟数（默认 5）
session.auto_save.save_interval_minutes = 5

# ---- 恢复 ----
# 新会话启动时是否显示恢复提示（默认 true）
session.restore.auto_prompt = true
# 历史记录最大保留天数（默认 7）
session.restore.max_history_age_days = 7

# ---- 存储 ----
# 最大总存储空间（默认 500MB；支持 NNMB / NNGB / 纯字节数）
session.storage.max_total_size = 500MB
# 单次保存最大体积（默认 50MB）
session.storage.max_single_save = 50MB
# 是否异步保存（默认 true）
session.storage.async_save = true
# 是否增量保存（默认 true）
session.storage.incremental_save = true

# ============================================================================
# 环境变量覆盖（设置后会覆盖上方文件值）
# ============================================================================
#   HARNESS_SESSION_AUTO_SAVE   -> session.auto_save.enable   (true/false)
#   HARNESS_SESSION_THRESHOLDS  -> session.auto_save.thresholds (如 "80,90")
#   HARNESS_SESSION_MAX_SAVES   -> session.auto_save.max_saves (整数)
#
# 注意：不存在 HARNESS_SESSION_TOKEN_THRESHOLD（早期文档笔误），
#       正确名称是 HARNESS_SESSION_THRESHOLDS（复数，逗号分隔列表）。
